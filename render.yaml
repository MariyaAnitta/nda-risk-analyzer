services:
  - type: web
    name: nda-risk-analyzer
    runtime: python
    buildCommand: "pip install --upgrade setuptools && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 900 --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
